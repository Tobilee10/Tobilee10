global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "itzoluwatobilee10@gmail.com"
  smtp_auth_username: "itzoluwatobilee10@gmail.com"
  smtp_auth_password_file: "/etc/alertmanager/secrets/smtp_password"
  smtp_require_tls: true

route:
  receiver: "email-alerts"

  group_by:
    - alertname
    - instance
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity="critical"
      receiver: "email-alerts"
      group_wait: 10s
      repeat_interval: 1h
    
    - matchers:
        - severity="warning"
      receiver: "email-alerts"
      group_wait: 30s
      repeat_interval: 4h


receivers:
  - name: "email-alerts"
    email_configs:
      - to: "itzoluwatobilee10@gmail.com"
        send_resolved: true