groups:
  - name: server-availability
    rules:

      - alert: NodeExporterDown
        expr: up{job="enterprise-linux-server"} == 0

        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is unavailable"
          description: "Prometheus cannot scrape Node Exporter on {{ $labels.instance }}."

      - alert: PrometheusTargetMissing
        expr: absent(up{job="enterprise-linux-server"})

        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Managed server target is missing"
          description: "Prometheus cannot fing the enterprise-linux-server monitoring target."