global:
  scrape_interval: 15s       #collect metrics every 15 seconds
  evaluation_interval: 15s    # evaluate alerting rules every 15 seconds
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
            
rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  # monitor Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - "localhost:9090"

  # Monitor the EC2 Linux server
  - job_name: "enterprise-linux-server"
    static_configs:
      - targets:
          - "3.133.146.143:9100"

